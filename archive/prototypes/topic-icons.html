<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>主题像素图标库 · 权威开源 1-Bit 像素全套 (55枚)</title>
  <style>
    :root {
      --bg: #FAF3E3;
      --card: #FFFDF6;
      --ink: #46382B;
      --ink-2: #6E5C46;
      --line: #E9DFC7;
      --outline: #3B2E22;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: var(--bg);
      background-image: radial-gradient(#e6dcc6 1px, transparent 1px);
      background-size: 9px 9px;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
    }
    h1 { font-size: 20px; margin: 0 0 4px; font-weight: 800; }
    p.sub { color: var(--ink-2); margin: 0 0 20px; font-size: 13px; }
    h2 { font-size: 14px; margin: 26px 0 12px; border-bottom: 2px dashed var(--line); padding-bottom: 6px; }
    
    .grid { display: flex; flex-wrap: wrap; gap: 12px; }
    .cell { width: 78px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .box {
      width: 52px;
      height: 52px;
      background: var(--card);
      border: 2px solid var(--outline);
      border-radius: 12px;
      box-shadow: 0 3px 0 rgba(59,46,34,.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    /* 核心样式：1-bit 纯净描边与色散特效 */
    .ic { display: inline-flex; width: 36px; height: 36px; }
    .ic svg { width: 100%; height: 100%; display: block; color: #281E19; }
    
    /* 参考图同款青粉复古色散 */
    .glitch-box .ic svg {
      filter: drop-shadow(-1px 0px 0px rgba(0, 240, 255, 0.85))
              drop-shadow(1px 0px 0px rgba(255, 0, 90, 0.85));
    }
    
    .name { font-size: 10px; color: var(--ink-2); text-align: center; line-height: 1.25; word-break: break-all; }
    .emoji { font-size: 13px; }
    
    .small .box { width: 28px; height: 28px; border-radius: 6px; box-shadow: 0 2px 0 rgba(59,46,34,.2); }
    .small .box .ic { width: 18px; height: 18px; }
    .small .cell { width: 36px; }
    .small .name { display: none; }
  </style>
</head>
<body>
  <h1>主题像素图标库 · 权威开源 1-Bit 像素全套 (55 枚)</h1>
  <p class="sub">Pixelarticons / Streamline / Withicons 融合定制 · 100% 还原参考图极简硬轮廓 · 任意放大无模糊</p>

  <div id="groups"></div>

  <script src="js/topic-icons.js"></script>
  <script>
    const emojiOf = {};
    for (const [e, k] of Object.entries(window.__TOPIC_EMOJI)) { if (!(k in emojiOf)) emojiOf[k] = e; }
    const keys = Object.keys(window.__TOPIC_ICONS);

    const cell = (k, glitch) => `
      <div class="cell">
        <div class="box ${glitch ? 'glitch-box' : ''}">${window.topicIcon(k)}</div>
        <div class="name">${k}<br><span class="emoji">${emojiOf[k] || ''}</span></div>
      </div>`;

    document.getElementById('groups').innerHTML = `
      <h2>复古色散效果（参考图同款青粉微色散 · 55枚）</h2>
      <div class="grid">${keys.map(k => cell(k, true)).join('')}</div>

      <h2>纯黑极简点阵（干净利落 1-bit 无杂色 · 55枚）</h2>
      <div class="grid">${keys.map(k => cell(k, false)).join('')}</div>

      <h2>微缩 16px 实测</h2>
      <div class="grid small">${keys.map(k => `<div class="cell"><div class="box">${window.topicIcon(k)}</div></div>`).join('')}</div>
    `;
  </script>
</body>
</html>
