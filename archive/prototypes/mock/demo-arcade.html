<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>脚印 · 潮玩街机像素版 Demo</title>
<style>
@font-face {
  font-family: "FusionPixel";
  src: url("../fonts/fusion-pixel-12px-proportional-zh_hans.otf.woff2") format("woff2");
  font-display: swap;
}
@font-face {
  font-family: "FusionPixelMono";
  src: url("../fonts/fusion-pixel-12px-monospaced-zh_hans.otf.woff2") format("woff2");
  font-display: swap;
}

:root {
  /* 高级潮玩配色方案：克制、温润、留白 */
  --bg-wall: #F0F2F5;       /* 降噪背景：从刺眼紫改为柔和的复古灰泥白 */
  --arcade-yellow: #FFD43B; /* 点睛黄：调低饱和度，更加耐看 */
  --arcade-green: #2ECC71;  /* 语义绿：更清爽的薄荷绿，用于主要行动 */
  --arcade-pink: #FF6B81;   /* 语义粉：降低荧光感，用于警告/强调用 */
  --card-bg: #FFFFFF;
  --card-sub: #FFFBF0;      /* 卡片副色：温暖的黄油奶昔白 */
  --stroke: #181512;        /* 经典硬核描边：保留不变 */
  --text-main: #181512;
  --text-muted: #7D766E;    /* 次级文字：稍微柔和一点，降低阅读疲劳 */
  --line-soft: #DED9C9;
  --shadow-hard: 3.5px 3.5px 0px var(--stroke);
  --shadow-btn: 2.5px 2.5px 0px var(--stroke);
  --shadow-btn-pressed: 1px 1px 0px var(--stroke);
  --font-px: "FusionPixel", "Courier New", monospace;
  --font-mono: "FusionPixelMono", monospace;
  --font-sans: "PingFang SC", "Microsoft YaHei", sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }

body {
  background-color: var(--bg-wall);
  background-image: 
    radial-gradient(rgba(0,0,0,0.04) 1px, transparent 1px);
  background-size: 20px 20px;
  color: var(--text-main);
  font-family: var(--font-sans);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 16px 0;
}

/* 手机外壳容器 (390×844) */
.device-frame {
  width: 390px;
  height: 844px;
  background: #F7F5EB;
  background-image: radial-gradient(#E2DEC9 1.5px, transparent 1.5px);
  background-size: 16px 16px;
  border: 4px solid var(--stroke);
  border-radius: 36px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.45), 10px 10px 0px #0F0A38;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* 顶部状态栏与刘海 */
.status-bar {
  height: 44px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 24px;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: bold;
  color: var(--text-main);
  z-index: 50;
}
.notch {
  width: 120px;
  height: 22px;
  background: var(--stroke);
  border-radius: 0 0 14px 14px;
  position: absolute;
  top: 0;
  left: calc(50% - 60px);
}

/* 滚动内容区 */
.screen-scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 4px 16px 84px 16px;
  scroll-behavior: smooth;
}
.screen-scroll::-webkit-scrollbar { width: 0; display: none; }

/* 街机像素按钮通用 */
.pixel-btn {
  background: var(--arcade-yellow);
  border: 2px solid var(--stroke);
  box-shadow: var(--shadow-btn);
  border-radius: 8px;
  font-family: var(--font-px);
  font-size: 13px;
  font-weight: bold;
  padding: 6px 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
  transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
  color: var(--stroke);
  text-decoration: none;
}
.pixel-btn:active {
  transform: translate(1.5px, 1.5px) scale(0.96);
  box-shadow: var(--shadow-btn-pressed);
}
.pixel-btn.green { background: var(--arcade-green); color: #000; }
.pixel-btn.cyan { background: var(--arcade-cyan); }
.pixel-btn.pink { background: var(--arcade-pink); color: #FFF; }
.pixel-btn.orange { background: var(--arcade-orange); color: #FFF; }
.pixel-btn.white { background: #FFFFFF; }
.pixel-btn.sm { font-size: 11px; padding: 4px 10px; border-width: 1.5px; }

/* 像素 SVG 图标通用 */
.px-icon {
  width: 28px;
  height: 28px;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  object-fit: contain;
  flex-shrink: 0;
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.px-icon.lg { width: 40px; height: 40px; }
.px-icon.sm { width: 20px; height: 20px; }
.px-fallback-emoji {
  user-select: none;
  font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

/* 顶部 HUD 用户栏 */
.hud-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.hud-user {
  display: flex;
  align-items: center;
  gap: 8px;
}
.hud-avatar-frame {
  width: 38px;
  height: 38px;
  background: var(--arcade-yellow);
  border: 2px solid var(--stroke);
  border-radius: 9px;
  box-shadow: 2px 2px 0px var(--stroke);
  display: grid;
  place-items: center;
  transition: transform 0.2s ease;
}
.hud-avatar-frame:hover { transform: scale(1.05) rotate(-3deg); }
.hud-user-title {
  font-family: var(--font-px);
  font-size: 15px;
  font-weight: bold;
}

/* 街机 HUD 数据条 (带金光闪烁微动效) */
.arcade-hud-banner {
  background: linear-gradient(135deg, var(--arcade-yellow) 0%, #FFC107 100%);
  border: 2.5px solid var(--stroke);
  border-radius: 12px;
  box-shadow: var(--shadow-hard);
  padding: 10px 14px;
  margin-bottom: 12px;
  position: relative;
  overflow: hidden;
}
.arcade-hud-banner::after {
  content: "";
  position: absolute;
  top: -50%;
  left: -70%;
  width: 45%;
  height: 200%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
  transform: rotate(25deg);
  animation: goldGlint 4.5s infinite cubic-bezier(0.4, 0, 0.2, 1);
  pointer-events: none;
}
@keyframes goldGlint {
  0%, 70% { left: -70%; }
  100% { left: 150%; }
}

.hud-top-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.hud-score-value {
  font-family: var(--font-mono);
  font-size: 28px;
  font-weight: 900;
  color: var(--stroke);
  line-height: 1;
}
.hud-stat-pill {
  background: #FFF;
  border: 1.5px solid var(--stroke);
  border-radius: 6px;
  box-shadow: 1.5px 1.5px 0px var(--stroke);
  padding: 3px 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: bold;
  display: flex;
  align-items: center;
  gap: 4px;
}
.hud-progress-wrap {
  margin-top: 8px;
  background: rgba(0,0,0,0.1);
  border: 1.5px solid var(--stroke);
  border-radius: 5px;
  height: 9px;
  overflow: hidden;
}
.hud-progress-fill {
  background: repeating-linear-gradient(
    -45deg,
    var(--arcade-green),
    var(--arcade-green) 6px,
    #18BD5D 6px,
    #18BD5D 12px
  );
  width: 72%;
  height: 100%;
}

/* 二级子 Tab 胶囊切换栏 (Q弹果冻交互动效) */
.sub-tab-bar {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
  background: #EAE6D6;
  border: 2px solid var(--stroke);
  border-radius: 12px;
  padding: 4px;
}
.sub-tab-btn {
  flex: 1;
  text-align: center;
  padding: 7px 0;
  font-family: var(--font-px);
  font-size: 12px;
  font-weight: bold;
  background: transparent;
  border: 2px solid transparent;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  color: var(--text-muted);
}
.sub-tab-btn.active {
  background: var(--arcade-yellow);
  color: var(--stroke);
  border-color: var(--stroke);
  box-shadow: 2px 2px 0px var(--stroke);
  transform: translateY(-2px);
}
.sub-tab-btn:active {
  transform: translateY(0) scale(0.96);
  box-shadow: 1px 1px 0px var(--stroke);
}

/* 内容转场动效 (切换 Tab 触发平滑上浮) */
.tab-content-anim {
  animation: tabFadeIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes tabFadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 模拟切换微缓冲 / 转场像素加载动效 (解决卡顿感知) */
.loading-wobble-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 40px 0;
  font-family: var(--font-px);
  font-size: 13px;
  color: var(--text-muted);
}
.wobble-dot {
  width: 10px;
  height: 10px;
  background: var(--arcade-yellow);
  border: 2px solid var(--stroke);
  border-radius: 2px;
  animation: dotJump 0.5s infinite ease-in-out alternate;
}
.wobble-dot:nth-child(2) { animation-delay: 0.15s; background: var(--arcade-green); }
.wobble-dot:nth-child(3) { animation-delay: 0.3s; background: var(--arcade-pink); }
@keyframes dotJump {
  from { transform: translateY(0); }
  to { transform: translateY(-10px); }
}

/* 主卡 (Hero Card) - 唯一重卡设计 */
.hero-card {
  background: #FFFFFF;
  border: 2.5px solid var(--stroke);
  border-radius: 12px;
  box-shadow: var(--shadow-hard);
  padding: 12px 14px;
  margin-bottom: 12px;
  position: relative;
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.hero-tag {
  position: absolute;
  top: -9px;
  left: 12px;
  background: var(--arcade-pink);
  color: #FFF;
  border: 1.5px solid var(--stroke);
  font-family: var(--font-px);
  font-size: 10px;
  font-weight: bold;
  padding: 1px 6px;
  border-radius: 4px;
}

/* 轻量内容行 */
.clean-item-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1.5px dashed var(--line-soft);
}
.clean-item-row:last-child {
  border-bottom: none;
}
.clean-item-title {
  font-size: 14px;
  font-weight: bold;
  flex: 1;
}

/* 周网格卡片 (Pixelife Matrix) */
.weekly-matrix-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 6px;
}
.weekly-matrix-table th {
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 4px 2px;
  text-align: center;
}
.weekly-matrix-table th.today-col {
  background: var(--arcade-yellow);
  color: var(--stroke);
  border-radius: 4px;
  border: 1.5px solid var(--stroke);
}
.weekly-matrix-table td {
  padding: 4px 2px;
  text-align: center;
}
.weekly-matrix-table td.today-cell {
  background: rgba(255, 230, 0, 0.18);
}
.matrix-cell {
  width: 24px;
  height: 24px;
  margin: 0 auto;
  border-radius: 5px;
  border: 1.5px solid var(--stroke);
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.1s ease;
}
.matrix-cell:active { transform: scale(0.85); }
.matrix-cell.done {
  background: var(--arcade-green);
  color: #000;
}
.matrix-cell.miss {
  background: #FFD4DF;
  color: var(--arcade-pink);
}
.matrix-cell.today-target {
  background: var(--arcade-yellow);
  box-shadow: 1.5px 1.5px 0px var(--stroke);
}

/* 月历卡片 (30天日历) */
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-top: 8px;
}
.cal-head {
  text-align: center;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: bold;
  color: var(--text-muted);
  padding-bottom: 4px;
}
.cal-cell {
  aspect-ratio: 1/1;
  border: 1.5px solid var(--stroke);
  border-radius: 6px;
  background: #FFF;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.1s ease;
}
.cal-cell:active { transform: scale(0.9); }
.cal-cell.done { background: var(--arcade-green); }
.cal-cell.miss { background: #FFD4DF; }
.cal-cell.today { border: 2.5px solid var(--arcade-orange); background: var(--arcade-yellow); }

/* 底部战报固定状态带 (三指标) */
.fixed-stat-bar {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  text-align: center;
  background: #FFF;
  border: 2px solid var(--stroke);
  border-radius: 10px;
  box-shadow: var(--shadow-btn);
  padding: 8px 4px;
  margin-top: 14px;
}

/* 街机分段跑马灯血槽 (愿望单进度条) */
.arcade-health-bar {
  height: 9px;
  background: #E8E4D5;
  border: 1.5px solid var(--stroke);
  border-radius: 5px;
  overflow: hidden;
  position: relative;
  margin-top: 6px;
}
.arcade-health-fill {
  height: 100%;
  background: repeating-linear-gradient(
    -45deg,
    var(--arcade-yellow),
    var(--arcade-yellow) 6px,
    #F39C12 6px,
    #F39C12 12px
  );
  background-size: 17px 17px;
  animation: healthConveyor 1.6s linear infinite;
}
@keyframes healthConveyor {
  from { background-position: 0 0; }
  to { background-position: 17px 0; }
}

/* Zoowy Agent 对话区块 (完全对齐原版 18-Agent-打开.png) */
.agent-card {
  background: #FFF;
  border: 2px solid var(--stroke);
  border-radius: 12px;
  box-shadow: var(--shadow-btn);
  padding: 12px;
  margin-top: 14px;
}
.agent-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 8px;
  border-bottom: 1.5px dashed var(--line-soft);
  font-size: 12px;
  font-weight: bold;
}
.agent-bubble {
  background: #F8F3E4;
  border: 1.5px solid var(--stroke);
  border-radius: 8px;
  padding: 9px 10px;
  font-size: 13px;
  line-height: 1.5;
  margin-top: 10px;
  box-shadow: 1.5px 1.5px 0px var(--stroke);
}
.agent-quick-chips {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 10px;
}
.agent-chip {
  background: #FFF;
  border: 1.5px solid var(--stroke);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 1.5px 1.5px 0px var(--stroke);
  transition: all 0.1s ease;
  text-align: left;
}
.agent-chip:active {
  transform: translate(1px, 1px);
  box-shadow: none;
  background: var(--arcade-yellow);
}
.agent-input-row {
  display: flex;
  gap: 6px;
  margin-top: 10px;
}
.agent-input {
  flex: 1;
  height: 36px;
  border: 1.5px solid var(--stroke);
  border-radius: 6px;
  padding: 0 10px;
  font-size: 12px;
  outline: none;
  background: #FAF7EE;
}

/* 底部 5-Tab 导航栏 */
.arcade-tabbar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 72px;
  background: #FFFFFF;
  border-top: 3px solid var(--stroke);
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding: 0 10px;
  z-index: 40;
}
.tab-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  cursor: pointer;
  color: var(--text-muted);
  font-family: var(--font-px);
  font-size: 11px;
  font-weight: bold;
  padding: 4px 10px;
  border-radius: 8px;
  transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.tab-btn.active {
  color: var(--stroke);
  background: var(--arcade-yellow);
  border: 2px solid var(--stroke);
  box-shadow: 2px 2px 0px var(--stroke);
  transform: translateY(-4px);
}

/* 浮动通知 Toast */
.arcade-toast {
  position: absolute;
  top: 54px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: var(--arcade-yellow);
  border: 2.5px solid var(--stroke);
  box-shadow: 4px 4px 0px var(--stroke);
  padding: 8px 16px;
  border-radius: 10px;
  font-family: var(--font-px);
  font-size: 12px;
  font-weight: bold;
  display: flex;
  align-items: center;
  gap: 8px;
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: all 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28);
}
.arcade-toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

/* 弹窗：发起新挑战 / 许愿窗口 */
.modal-layer {
  position: absolute;
  inset: 0;
  background: rgba(24, 21, 18, 0.65);
  backdrop-filter: blur(2px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 80;
}
.modal-layer.open { display: flex; }
.modal-box {
  width: 100%;
  background: #FFF;
  border: 3px solid var(--stroke);
  border-radius: 16px;
  box-shadow: 5px 5px 0px var(--stroke);
  padding: 16px;
}
</style>
</head>
<body>

<div class="device-frame">
  <!-- iPhone 状态栏 -->
  <div class="notch"></div>
  <div class="status-bar">
    <span>9:41</span>
    <div style="display:flex; gap:6px;"><span>5G</span><span>100%</span></div>
  </div>

  <!-- 浮动 Toast -->
  <div class="arcade-toast" id="toast">
    <span id="toast-icon">⚡</span>
    <span id="toast-msg">打卡成功！+34 PTS</span>
  </div>

  <!-- 动态滚动页面 -->
  <div class="screen-scroll" id="screen-content"></div>

  <!-- 底部街机 5-Tab 导航 -->
  <nav class="arcade-tabbar">
    <div class="tab-btn active" onclick="switchTabWithAnim('home')">
      <img src="./icons/star.svg" class="px-icon sm" alt="" onerror="handleIconError(this, 'star')"/>
      <span>今天</span>
    </div>
    <div class="tab-btn" onclick="switchTabWithAnim('goals')">
      <img src="./icons/target.svg" class="px-icon sm" alt="" onerror="handleIconError(this, 'target')"/>
      <span>目标</span>
    </div>
    <div class="tab-btn" onclick="switchTabWithAnim('wish')">
      <img src="./icons/gift.svg" class="px-icon sm" alt="" onerror="handleIconError(this, 'gift')"/>
      <span>愿望单</span>
    </div>
    <div class="tab-btn" onclick="switchTabWithAnim('coop')">
      <img src="./icons/cat.svg" class="px-icon sm" alt="" onerror="handleIconError(this, 'cat')"/>
      <span>我们</span>
    </div>
    <div class="tab-btn" onclick="switchTabWithAnim('me')">
      <img src="./icons/trophy.svg" class="px-icon sm" alt="" onerror="handleIconError(this, 'trophy')"/>
      <span>我的</span>
    </div>
  </nav>

  <!-- 弹窗：发起新挑战 -->
  <div class="modal-layer" id="new-goal-modal">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid var(--stroke); padding-bottom:8px; margin-bottom:12px;">
        <span style="font-family:var(--font-px); font-size:15px; font-weight:bold;">⚔️ 发起新挑战</span>
        <button class="pixel-btn sm white" onclick="closeModal()">✕</button>
      </div>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <input type="text" id="goal-input-name" placeholder="例如: 雅思真题刷题" 
          style="width:100%; height:38px; border:2px solid var(--stroke); border-radius:8px; padding:0 10px; font-size:13px; font-weight:bold; outline:none;"/>
        <div style="display:flex; gap:8px;">
          <div class="px-icon-pick active" style="padding:4px; border:2px solid var(--stroke); background:var(--arcade-yellow); border-radius:8px; cursor:pointer;" onclick="selectIcon(this, 'book')">
            <img src="./icons/book.svg" class="px-icon sm" alt="" onerror="handleIconError(this, 'book')"/>
          </div>

const ICON_EMOJI_MAP = {
  cat: '🐱', sprout: '🌱', book: '📖', piano: '🎹', gym: '🏋️',
  sleep: '💤', coin: '🪙', hotpot: '🍲', headphone: '🎧', gamepad: '🎮',

window.handleIconError = function(img, iconName) {
  if (!img.dataset.retried) {
    img.dataset.retried = '1';
    img.src = './icons/' + iconName + '.svg';
    return;
  }
  img.style.display = 'none';
  if (img.nextElementSibling && img.nextElementSibling.classList.contains('px-fallback-emoji')) return;
  const emoji = ICON_EMOJI_MAP[iconName] || '✨';
  const span = document.createElement('span');
  span.className = img.className + ' px-fallback-emoji';
  span.style.fontSize = img.classList.contains('lg') ? '28px' : (img.classList.contains('sm') ? '16px' : '20px');
  span.innerText = emoji;
  img.parentNode.insertBefore(span, img.nextSibling);
};

function pxIcon(name, cls = '') {
  return `<img src="./icons/${name}.svg" class="px-icon ${cls}" alt="" onerror="handleIconError(this, '${name}')"/>`;
}

function triggerCheckin(questId) {
  const q = state.quests.find(x => x.id === questId);

  q.done = !q.done;

    state.user.todayFinished += 1;
    showToast(`战斗胜利！+${q.points} PTS 已入账 ⚡`, '🎉');
  } else {
    state.user.coins -= q.points;
    state.user.todayFinished -= 1;
    showToast(`已撤销打卡，积分已退还。`, '↩️');

  render();
}

  setTimeout(() => {

      state.agentStep = 'asking';
    } else if (choiceText.includes('小时') || choiceText.includes('冲刺')) {
      state.agentStep = 'proposing';
    } else if (choiceText.includes('确认') || choiceText.includes('建挑战')) {

    render();
  }, 220);
}
