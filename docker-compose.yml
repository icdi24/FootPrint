services:
  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?请在 .env 里设置 POSTGRES_PASSWORD}
      - POSTGRES_DB=footprint
    volumes:
      - ./runtime/pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  footprint:
    build: .
    ports:
      - "3201:3000"
    environment:
      - PORT=3000
      - DATA_DIR=/app/data
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@db:5432/footprint
      # 统一调用 DeepSeek 官方 API。凭据由服务端使用。
      - DEEPSEEK_CREDENTIAL_KEY=${DEEPSEEK_CREDENTIAL_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-flash}
    volumes:
      - ./runtime/data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
